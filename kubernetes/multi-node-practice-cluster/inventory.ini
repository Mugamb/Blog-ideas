[kube_control_plane]
control-plane ansible_host=192.168.56.10 ip=192.168.56.10 ansible_ssh_private_key_file=~/kubernetes-vagrant-lab/.vagrant/machines/control-plane/virtualbox/private_key

[etcd:children]
kube_control_plane

[kube_node]
worker-1 ansible_host=192.168.56.11 ip=192.168.56.11 ansible_ssh_private_key_file=~/kubernetes-vagrant-lab/.vagrant/machines/worker-1/virtualbox/private_key
worker-2 ansible_host=192.168.56.12 ip=192.168.56.12 ansible_ssh_private_key_file=~/kubernetes-vagrant-lab/.vagrant/machines/worker-2/virtualbox/private_key

[all:vars]
ansible_user=vagrant
ansible_python_interpreter=/usr/bin/python3
